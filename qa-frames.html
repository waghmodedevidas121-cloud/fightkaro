<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FightKaro — QA frames</title>
<style>
    html, body { margin: 0; background: #0a0c11; color: #7c8798; font: 12px/1.4 'Segoe UI', system-ui, sans-serif; }
    .row { display: flex; gap: 18px; padding: 18px; align-items: flex-start; }
    figure { margin: 0; }
    figcaption { padding: 0 0 6px 2px; letter-spacing: 1.4px; text-transform: uppercase; font-size: 10px; color: #56606f; }
    iframe { display: block; border: 1px solid #222836; background: #000; }
</style>
</head>
<body>
<div class="row">
    <figure>
        <figcaption>390 x 844 — phone, touch pad on</figcaption>
        <iframe src="./?demo=fight&touch=1" width="390" height="844"></iframe>
    </figure>
    <figure>
        <figcaption>844 x 390 — landscape phone</figcaption>
        <iframe src="./?demo=fight&touch=1" width="844" height="390"></iframe>
    </figure>
</div>
</body>
</html>
